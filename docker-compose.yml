services:
  db:
    image: ankane/pgvector:latest  # PostgreSQL pre-packaged with pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: savanna_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: savanna-multilingual-assistant-api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@db:5432/savanna_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  web:
    image: nginx:alpine
    ports:
      - "8086:80"
    volumes:
      - ./savanna:/usr/share/nginx/html:ro
      - ./module:/usr/share/nginx/html/module:ro
      - ./demo:/usr/share/nginx/html/demo:ro

# This missing block caused the error
volumes:
  pgdata: